name: Deploy to Firebase Hosting (live)

on:
  push:
    branches: [main]

concurrency:
  group: deploy-live
  cancel-in-progress: true

# Least privilege: the deploy needs to read the repo and write a commit
# status; nothing else. Without this the job inherits the repo default.
permissions:
  contents: read
  checks: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm --prefix functions ci
      - run: npm --prefix functions test
      # Backend deploys BEFORE hosting: the /api/** rewrite in the new
      # hosting release must point at a function that already exists.
      # Prereqs (one-time, console): Blaze billing, Firestore DB in
      # europe-west1, this service account granted Cloud Functions Admin +
      # Service Account User + Firebase Rules Admin + Secret Manager
      # Viewer (secret-version validation runs on every deploy), the three
      # function secrets set (see AGENTS.md "Social backend"), and the
      # FIRST deploy run from a logged-in owner machine (it grants the
      # runtime SA access to those secrets).
      - name: Deploy backend (functions + Firestore rules)
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"
          npx firebase-tools@15 deploy --only functions,firestore:rules --project dbln-b56ec --non-interactive --force
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DBLN_B56EC }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
      # SHA-pinned (this action receives the production deploy credential; a
      # floating @v0 tag would let a compromised release publish to live).
      - uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0.11.0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DBLN_B56EC }}
          channelId: live
          projectId: dbln-b56ec
